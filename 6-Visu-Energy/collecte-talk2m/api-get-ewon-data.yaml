- id: d276c0c8069d9693
  type: subflow
  name: api_get_ewon_data
  normalizedLabel: api-get-ewon-data
  info: >-
    Récupère les valeurs en temps réel de tous les capteurs d'une machine
    spécifique via une requête HTTP sécurisée.


    Entrées requises :

    - msg.t2mUsername

    - msg.t2mPassword

    - msg.ewonName
  category: Ewon API
  in:
    - x: 60
      "y": 80
      wires:
        - id: a827466d935672fb
  out:
    - x: 780
      "y": 80
      wires:
        - id: d4a88717de182950
          port: 0
  env:
    - name: T2M_ACCOUNT
      type: str
      value: ""
    - name: T2M_DEVID
      type: str
      value: ""
    - name: T2M_DEVICE_USER
      type: str
      value: ""
    - name: T2M_DEVICE_PASS
      type: str
      value: ""
  color: "#E6821E"
  icon: node-red/white-globe.svg
- id: a827466d935672fb
  type: function
  z: d276c0c8069d9693
  name: Build Request – Live Data
  func: >-
    const account    = env.get('T2M_ACCOUNT');

    const devId      = env.get('T2M_DEVID');

    const deviceUser = env.get('T2M_DEVICE_USER');

    const devicePass = env.get('T2M_DEVICE_PASS');


    msg.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };

    msg.method  = 'POST';

    msg.url     =
    `https://m2web.talk2m.com/t2mapi/get/${msg.ewonName}/rcgi.bin/ParamForm`;


    msg.payload = {
        t2maccount:         account,
        t2musername:        msg.t2mUsername,
        t2mpassword:        msg.t2mPassword,
        t2mdeveloperid:     devId,
        t2mdeviceusername:  deviceUser,
        t2mdevicepassword:  devicePass,
        AST_Param:          '$dtIV$ftT'
    };


    return msg;
  outputs: 1
  timeout: ""
  noerr: 0
  initialize: ""
  finalize: ""
  libs: []
  x: 280
  "y": 80
  wires:
    - - d4a88717de182950
- id: d4a88717de182950
  type: http request
  z: d276c0c8069d9693
  name: GET Live Data
  method: use
  ret: txt
  paytoqs: ignore
  url: ""
  x: 540
  "y": 80
  wires:
    - []
