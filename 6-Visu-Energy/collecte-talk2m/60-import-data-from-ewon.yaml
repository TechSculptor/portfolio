- id: 8190abda44425b07
  type: function
  z: 91608584366dc5a3
  name: 🔎 extract_ewon_names
  func: >-
    //debug1

    if (!msg.payload || !msg.payload.ewons) {
        node.status({ fill: 'red', shape: 'dot', text: 'payload.ewons absent' });
        node.error('[extract] msg.payload.ewons absent');
        return null;
    }

    //debug1


    var ewons = msg.payload.ewons;

    var names = [];

    var statuts = {};

    var ewons_list =[];


    for (var i = 0; i < ewons.length; i++) {
        var e = ewons[i];
        if (e.name) { 
            names.push(e.name); 
            statuts[e.name] = e.status || 'unknown';
            ewons_list.push({"name": e.name, "description": e.description});

        }
    }


    names.sort();


    var onlineNames = names.filter(function (n) { 
        return statuts[n] === 'online';
    });



    msg.ewons_list = ewons_list;

    msg.names = names;

    msg.onlineNames = onlineNames;


    node.status({ fill: 'green', shape: 'dot', text: names.length + ' Talk2M ('
    + onlineNames.length + ' on)' });

    return msg;
  outputs: 1
  timeout: ""
