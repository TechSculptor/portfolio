- id: f70474029074478b
  type: function
  z: 91608584366dc5a3
  name: 📡 build_tags_request
  func: >-
    var cfg = global.get('t2m_config');


    var ewon_name = msg.request.nom_valise;


    //debug1

    if (!ewon_name) {
        node.status({fill:'red', shape:'dot', text:'ewon_name absent'});
        return null;
    }

    //debug1


    //prepare the request

    var params = [
        't2maccount=' + encodeURIComponent(cfg.t2m_account),
        't2musername=' + encodeURIComponent(cfg.t2m_username),
        't2mpassword=' + encodeURIComponent(global.get('T2M_PASSWORD') || cfg.t2m_password),
        't2mdeveloperid=' + encodeURIComponent(cfg.t2m_developer_id),
        't2mdeviceusername=' + encodeURIComponent(cfg.device_username),
        't2mdevicepassword=' + encodeURIComponent(global.get('T2M_DEVICE_PASSWORD') || cfg.device_password),
        'AST_Param=' + encodeURIComponent('$dtIV$ftT')
    ].join('&');

    msg.method = 'GET';

    msg.url = global.get('TALK2M_M2WEB_BASE_URL') + '/get/' +
    encodeURIComponent(ewon_name) + '/rcgi.bin/ParamForm?' + params;

    msg.payload = null;

    msg.requestTimeout = 15000;


    node.status({fill:'blue', shape:'ring', text: ewon_name});


    return msg;
