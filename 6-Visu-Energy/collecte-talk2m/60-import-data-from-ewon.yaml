  name: switch upsert/add mode for valises
  func: |-
    if (msg.topic === 'AUTH_ERROR') return msg;
    // Par défaut on met à jour si la valise existe déjà.
    const mode = msg.mode || "ALL";

    // Garde-fou : sans nom d'eWON il n'y a pas de valise à créer.
    const nomValise = msg.params && msg.params[0];
    if (!nomValise || String(nomValise).trim() === "") {
        node.status({fill:'grey', shape:'ring', text:'sans nom eWON — ignoré'});
        return null;
    }

    if (mode === "NEW") {
        // Mode Add : ajoute uniquement les nouvelles, ignore les existantes
        msg.query = `
            INSERT INTO valises (nom_valise, description)
            VALUES ($1, $2)
            ON CONFLICT (nom_valise) DO NOTHING;
        `;
    } else {
        // Mode Upsert : met à jour la description si la valise existe déjà
        msg.query = `
            INSERT INTO valises (nom_valise, description)
            VALUES ($1, $2)
            ON CONFLICT (nom_valise)
            DO UPDATE SET description = COALESCE(EXCLUDED.description, valises.description);
        `;
    }

    node.status({fill:'blue', shape:'ring', text: String(nomValise)});
    return msg;
