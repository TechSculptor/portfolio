- id: ad1c13738ddc1ac5
  type: function
  z: 91608584366dc5a3
  name: switch upsert/add mode for voie_parametrage
  func: |-
    if (msg.topic === 'AUTH_ERROR') return msg;
    let mode = msg.mode || "ALL";

    if (mode === "ALL") {
        msg.query = `
            INSERT INTO voies_parametrage (
                valise_id, numero_voie, nom_voie, etat_voie, 
                seuil_haut, seuil_bas, ct_ratio, val_tc, tc_cumul, maj_a
            )
            VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9, NOW())
            ON CONFLICT (valise_id, numero_voie)
            DO UPDATE SET
                nom_voie   = COALESCE(EXCLUDED.nom_voie,   voies_parametrage.nom_voie),
                etat_voie  = COALESCE(EXCLUDED.etat_voie,  voies_parametrage.etat_voie),
                seuil_haut = COALESCE(EXCLUDED.seuil_haut, voies_parametrage.seuil_haut),
                seuil_bas  = COALESCE(EXCLUDED.seuil_bas,  voies_parametrage.seuil_bas),
                ct_ratio   = COALESCE(EXCLUDED.ct_ratio,   voies_parametrage.ct_ratio),
                val_tc     = COALESCE(EXCLUDED.val_tc,     voies_parametrage.val_tc),
                tc_cumul   = COALESCE(EXCLUDED.tc_cumul,   voies_parametrage.tc_cumul),
                maj_a      = NOW();
        `;
    } else if (mode === "NEW") {
        msg.query = `
            INSERT INTO voies_parametrage (
                valise_id, numero_voie, nom_voie, etat_voie, 
                seuil_haut, seuil_bas, ct_ratio, val_tc, tc_cumul, maj_a
            )
            VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9, NOW())
            ON CONFLICT (valise_id, numero_voie) DO NOTHING;
        `;
    }

    return msg;
