- id: 33290bb32a9c873e
  type: function
  z: 91608584366dc5a3
  name: switch upsert/add mode for projets
  func: >-
    if (msg.topic === 'AUTH_ERROR') return msg;

    // Par défaut on met à jour si le projet existe déjà.

    const mode = msg.mode || "ALL";


    // Garde-fou : sans nom de projet il n'y a rien à créer, et surtout rien à

    // lier ensuite à la valise. On arrête la branche ici plutôt que d'envoyer

    // une requête vouée à échouer (nom_projet est NOT NULL en base).

    const nomProjet = msg.params && msg.params[0];

    if (!nomProjet || String(nomProjet).trim() === "") {
        node.status({fill:'grey', shape:'ring', text:'sans NOM_PROJET — ignoré'});
        return null;
    }


    // etat_projet, sequence_ewon et date_debut_projet sont NOT NULL en base :

    // à la CRÉATION on fournit une valeur de repli au lieu de laisser l'INSERT

    // échouer quand le tag eWON correspondant est absent.

    //

    // À la MISE À JOUR en revanche, surtout ne pas réutiliser EXCLUDED : ce

    // serait la valeur de repli (0 / NOW()), qui écraserait une date de début

    // de projet correcte par la date du jour. On garde donc la valeur déjà en

    // base quand le tag eWON n'a rien renvoyé.

    const colonnes = "(nom_projet, etat_projet, sequence_ewon,
    date_debut_projet, date_fin_projet)";

    const valeurs = "($1, COALESCE($2::smallint, 0), COALESCE($3::smallint, 0),
    COALESCE($4::timestamptz, NOW()), $5::timestamptz)";


    if (mode === "NEW") {
        // Mode Add : crée le projet s'il est nouveau, ignore s'il existe déjà
        msg.query = `
            INSERT INTO projets ${colonnes}
            VALUES ${valeurs}
            ON CONFLICT (nom_projet) DO NOTHING;
        `;
    } else {
        // Mode Upsert : écrase les anciennes valeurs si le projet existe déjà
        msg.query = `
            INSERT INTO projets ${colonnes}
            VALUES ${valeurs}
            ON CONFLICT (nom_projet)
            DO UPDATE SET
                etat_projet       = COALESCE($2::smallint,     projets.etat_projet),
                sequence_ewon   = COALESCE($3::smallint,     projets.sequence_ewon),
                date_debut_projet = COALESCE($4::timestamptz,  projets.date_debut_projet),
                date_fin_projet   = COALESCE($5::timestamptz,  projets.date_fin_projet);
        `;
    }


    node.status({fill:'blue', shape:'ring', text: String(nomProjet)});

    return msg;
  outputs: 1
  timeout: 0
  noerr: 0
  initialize: ""
  finalize: ""
