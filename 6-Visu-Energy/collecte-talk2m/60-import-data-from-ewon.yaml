- id: ef8d1a221823af0d
  type: postgresql
  z: 91608584366dc5a3
  name: lien valise → projet
  query: |-
    -- Rattache la valise au projet lu sur l'eWON.
    -- $1 = nom du projet, $2 = nom de la valise (nom eWON).
    -- Si $1 ou $2 est NULL, aucune ligne ne correspond : pas d'erreur,
    -- simplement aucune mise à jour.
    UPDATE valises v
       SET projet_id = p.id
      FROM projets p
     WHERE p.nom_projet = $1
       AND v.nom_valise = $2
       AND v.projet_id IS DISTINCT FROM p.id
    RETURNING v.id, v.nom_valise, v.projet_id, p.nom_projet;
  postgreSQLConfig: d5a1386edf214a95
  split: false
  rowsPerMsg: 1
  outputs: 1
