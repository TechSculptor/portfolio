# Render blueprint: live demo of the 5-Starshop project (Symfony + PostgreSQL).
# The other projects of the portfolio are not deployed here.
#
# Free plan: the service goes to sleep after 15 min of inactivity (~1 min to wake up)
# and the free PostgreSQL database expires 30 days after its creation.
# The demo data is recreated every time the service starts.

databases:
  - name: starshop-db
    plan: free
    region: frankfurt
    databaseName: starshop
    user: starshop

services:
  - type: web
    name: starshop
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./5-Starshop/Dockerfile
    dockerContext: ./5-Starshop
    healthCheckPath: /login
    # Only redeploys when the Starshop project changes (not for a simple README change)
    buildFilter:
      paths:
        - 5-Starshop/**
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: starshop-db
          property: connectionString
      - key: MERCURE_JWT_SECRET
        generateValue: true
      # Read-only demo account (public password, documented in the README)
      - key: DEMO_EMAIL
        value: demo@starshop.dev
      - key: DEMO_PASSWORD
        value: starshop-demo
      # Administrator account: set it in the Render dashboard (never in the repository).
      # If it is empty, no admin account is created.
      - key: ADMIN_EMAIL
        value: admin@starshop.dev
      - key: ADMIN_PASSWORD
        sync: false
